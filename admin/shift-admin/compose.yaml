services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      -p "3001:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - admin
    restart: unless-stopped